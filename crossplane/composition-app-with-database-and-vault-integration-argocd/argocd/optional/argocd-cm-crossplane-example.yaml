apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm-crossplane-example
  namespace: argocd
data:
  application.resourceTrackingMethod: annotation
  resource.exclusions: |
    - apiGroups:
      - "*"
      kinds:
      - ProviderConfigUsage
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
  resource.customizations: |
    "*.crossplane.io/*":
      health.lua: |
        health_status = {
          status = "Progressing",
          message = "Provisioning ..."
        }

        local function contains(table, val)
          for _, v in ipairs(table) do
            if v == val then
              return true
            end
          end
          return false
        end

        local has_no_status = {
          "Composition",
          "CompositionRevision",
          "DeploymentRuntimeConfig",
          "ClusterProviderConfig",
          "ProviderConfig",
          "ProviderConfigUsage"
        }

        if obj.status == nil or next(obj.status) == nil and contains(has_no_status, obj.kind) then
          health_status.status = "Healthy"
          health_status.message = "Resource is up-to-date."
          return health_status
        end

        if obj.status == nil or next(obj.status) == nil or obj.status.conditions == nil then
          if (obj.kind == "ProviderConfig" or obj.kind == "ClusterProviderConfig") and obj.status ~= nil and obj.status.users ~= nil then
            health_status.status = "Healthy"
            health_status.message = "Resource is in use."
            return health_status
          end
          return health_status
        end

        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "LastAsyncOperation" and condition.status == "False" then
            health_status.status = "Degraded"
            health_status.message = condition.message
            return health_status
          end

          if condition.type == "Synced" and condition.status == "False" then
            health_status.status = "Degraded"
            health_status.message = condition.message
            return health_status
          end

          if condition.type == "Installed" and condition.status == "False" then
            health_status.status = "Degraded"
            health_status.message = condition.message
            return health_status
          end

          if contains({"Ready", "Healthy", "Offered", "Established", "ValidPipeline", "RevisionHealthy"}, condition.type) then
            if condition.status == "True" or (condition.type == "Established" and condition.reason == "InactiveManagedResource") then
              health_status.status = "Healthy"
              health_status.message = "Resource is up-to-date."
            end
          end
        end

        return health_status
    "*.upbound.io/*":
      health.lua: |
        health_status = {
          status = "Progressing",
          message = "Provisioning ..."
        }

        local function contains(table, val)
          for _, v in ipairs(table) do
            if v == val then
              return true
            end
          end
          return false
        end

        local has_no_status = {
          "ClusterProviderConfig",
          "ProviderConfig",
          "ProviderConfigUsage"
        }

        if obj.status == nil or next(obj.status) == nil and contains(has_no_status, obj.kind) then
          health_status.status = "Healthy"
          health_status.message = "Resource is up-to-date."
          return health_status
        end

        if obj.status == nil or next(obj.status) == nil or obj.status.conditions == nil then
          if (obj.kind == "ProviderConfig" or obj.kind == "ClusterProviderConfig") and obj.status ~= nil and obj.status.users ~= nil then
            health_status.status = "Healthy"
            health_status.message = "Resource is in use."
            return health_status
          end
          return health_status
        end

        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "LastAsyncOperation" and condition.status == "False" then
            health_status.status = "Degraded"
            health_status.message = condition.message
            return health_status
          end

          if condition.type == "Synced" and condition.status == "False" then
            health_status.status = "Degraded"
            health_status.message = condition.message
            return health_status
          end

          if condition.type == "Ready" and condition.status == "True" then
            health_status.status = "Healthy"
            health_status.message = "Resource is up-to-date."
          end
        end

        return health_status
    external-secrets.io/*:
      health.lua: |
        health_status = {
          status = "Progressing",
          message = "Waiting for External Secrets reconciliation"
        }

        if obj.status == nil or obj.status.conditions == nil then
          return health_status
        end

        for _, condition in ipairs(obj.status.conditions) do
          if (condition.type == "Ready" or condition.type == "Synced") and condition.status == "False" then
            health_status.status = "Degraded"
            health_status.message = condition.message
            return health_status
          end

          if (condition.type == "Ready" or condition.type == "Synced") and condition.status == "True" then
            health_status.status = "Healthy"
            health_status.message = condition.message or "External Secrets resource is ready"
          end
        end

        return health_status
    example.com/*:
      health.lua: |
        health_status = {
          status = "Progressing",
          message = "Waiting for Crossplane reconciliation"
        }

        if obj.status == nil or obj.status.conditions == nil then
          return health_status
        end

        for _, condition in ipairs(obj.status.conditions) do
          if (condition.type == "Synced" or condition.type == "Ready") and condition.status == "False" then
            health_status.status = "Degraded"
            health_status.message = condition.message
            return health_status
          end

          if condition.type == "Ready" and condition.status == "True" then
            health_status.status = "Healthy"
            health_status.message = condition.message or "Composite resource is ready"
          end
        end

        return health_status
