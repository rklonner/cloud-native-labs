apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-razorapps-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rklonner/cloud-native-labs.git
    targetRevision: HEAD
    path: crossplane/composition-app-with-database-and-vault-integration-argocd/argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
