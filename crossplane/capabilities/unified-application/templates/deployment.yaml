apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unified-application.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "unified-application.name" . }}
spec:
  replicas: {{ .Values.application.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "unified-application.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "unified-application.name" . }}
    spec:
      containers:
        - name: app
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
{{- if include "unified-application.hasConnectionEnv" . }}
          env:
{{ include "unified-application.connectionEnv" . | indent 12 }}
{{- end }}
          ports:
            - containerPort: {{ .Values.application.containerPort }}
