apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: compositeappsecretimports.idp.demo.io
spec:
  compositeTypeRef:
    apiVersion: idp.demo.io/v1alpha1
    kind: CompositeAppSecretImport
  mode: Pipeline
  pipeline:
    - step: render-secret-import
      functionRef:
        name: crossplane-contrib-function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        spec:
          source: |
            oxr = option("params").oxr

            app_name = oxr.spec.appName
            import_name = oxr.spec.importName
            target_namespace = oxr.spec.namespace or "default"
            vault_source = oxr.spec.source.vault
            bind_as = oxr.spec.bindAs or {}
            secret_store_name = vault_source.secretStoreRef or "vault-app-backend"
            raw_secret_name = app_name + "-" + import_name + "-raw"
            target_secret_name = bind_as.secretName or app_name + "-" + import_name
            field_map = vault_source.fieldMap or {}

            username_field = field_map.username or "username"
            password_field = field_map.password or "password"

            raw_secret = {
              apiVersion = "external-secrets.io/v1"
              kind = "ExternalSecret"
              metadata = {
                name = raw_secret_name,
                namespace = target_namespace,
                annotations = {
                  "krm.kcl.dev/composition-resource-name" = "raw-secret-import"
                }
              }
              spec = {
                refreshInterval = "1m",
                    secretStoreRef = {
                      name = secret_store_name,
                      kind = "ClusterSecretStore"
                    },
                target = {
                  name = raw_secret_name,
                  creationPolicy = "Owner"
                },
                dataFrom = [{
                  extract = {
                    key = vault_source.path
                  }
                }]
              }
            }

            _items = [raw_secret]

            if bind_as.secretName:
              _items = _items + [{
                apiVersion = "external-secrets.io/v1"
                kind = "ExternalSecret"
                metadata = {
                  name = target_secret_name,
                  namespace = target_namespace,
                  annotations = {
                    "krm.kcl.dev/composition-resource-name" = "app-secret-import"
                  }
                }
                spec = {
                  refreshInterval = "1m",
                  secretStoreRef = {
                    name = secret_store_name,
                    kind = "ClusterSecretStore"
                  },
                  target = {
                    name = target_secret_name,
                    creationPolicy = "Owner"
                  },
                  dataFrom = [{
                    extract = {
                      key = vault_source.path
                    }
                  }]
                }
              }]

            if bind_as.usernamePassword?.envVars:
              _items = _items + [{
                apiVersion = "external-secrets.io/v1"
                kind = "ExternalSecret"
                metadata = {
                  name = target_secret_name,
                  namespace = target_namespace,
                  annotations = {
                    "krm.kcl.dev/composition-resource-name" = "app-secret-import"
                  }
                }
                spec = {
                  refreshInterval = "1m",
                  secretStoreRef = {
                    name = secret_store_name,
                    kind = "ClusterSecretStore"
                  },
                  target = {
                    name = target_secret_name,
                    creationPolicy = "Owner"
                  },
                  data = [
                    {
                      secretKey = bind_as.usernamePassword.envVars.username,
                      remoteRef = {
                        key = vault_source.path,
                        property = username_field
                      }
                    },
                    {
                      secretKey = bind_as.usernamePassword.envVars.password,
                      remoteRef = {
                        key = vault_source.path,
                        property = password_field
                      }
                    }
                  ]
                }
              }]

            _items
