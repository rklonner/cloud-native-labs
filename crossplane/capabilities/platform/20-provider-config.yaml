apiVersion: v1
kind: Secret
metadata:
  name: mssql-conn
  namespace: crossplane-system
type: Opaque
stringData:
  # From inside the Docker-backed vcluster, the host-published MSSQL port is
  # reachable via the container network gateway.
  endpoint: 172.22.0.1
  port: "1433"
  username: sa
  password: YourStrong!Passw0rd
---
apiVersion: mssql.sql.m.crossplane.io/v1alpha1
kind: ClusterProviderConfig
metadata:
  name: mssql-local
spec:
  credentials:
    source: MSSQLConnectionSecret
    connectionSecretRef:
      name: mssql-conn
      namespace: crossplane-system
