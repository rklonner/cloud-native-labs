apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capabilities-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/example-org/cloud-native-labs.git
    targetRevision: main
    path: crossplane/capabilities/argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
