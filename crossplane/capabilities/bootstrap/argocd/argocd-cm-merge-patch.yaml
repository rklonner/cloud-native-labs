apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  application.resourceTrackingMethod: annotation

  resource.exclusions: |
    - apiGroups:
      - "*"
      kinds:
      - ProviderConfigUsage

  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil and obj.status.health ~= nil then
      hs.status = obj.status.health.status
      if obj.status.health.message ~= nil then
        hs.message = obj.status.health.message
      end
    end
    return hs

  resource.customizations.health.pkg.crossplane.io_Provider: &genericConditionHealth |
    hs = {}
    hs.status = "Progressing"
    hs.message = "Waiting for reconciliation"

    local function contains(table, val)
      for _, v in ipairs(table) do
        if v == val then
          return true
        end
      end
      return false
    end

    local no_status_ok = {
      "Composition",
      "CompositionRevision",
      "CompositeResourceDefinition",
      "DeploymentRuntimeConfig",
      "ClusterProviderConfig",
      "ProviderConfig",
      "ProviderConfigUsage"
    }

    if obj.status == nil or next(obj.status) == nil then
      if contains(no_status_ok, obj.kind) then
        hs.status = "Healthy"
        hs.message = "Resource is up-to-date."
      end
      return hs
    end

    if (obj.kind == "ProviderConfig" or obj.kind == "ClusterProviderConfig") and obj.status.users ~= nil then
      hs.status = "Healthy"
      hs.message = "Resource is in use."
      return hs
    end

    if obj.status.conditions == nil then
      return hs
    end

    for _, condition in ipairs(obj.status.conditions) do
      if contains({"LastAsyncOperation", "Synced", "Ready", "Healthy", "Offered", "Established", "ValidPipeline", "RevisionHealthy", "Installed"}, condition.type) and condition.status == "False" then
        hs.status = "Degraded"
        hs.message = condition.message or (condition.type .. " is False")
        return hs
      end

      if contains({"Synced", "Ready", "Healthy", "Offered", "Established", "ValidPipeline", "RevisionHealthy", "Installed"}, condition.type) then
        if condition.status == "True" or (condition.type == "Established" and condition.reason == "InactiveManagedResource") then
          hs.status = "Healthy"
          hs.message = condition.message or "Resource is up-to-date."
        end
      end
    end

    return hs

  resource.customizations.health.pkg.crossplane.io_Function: *genericConditionHealth
  resource.customizations.health.pkg.crossplane.io_ProviderRevision: *genericConditionHealth
  resource.customizations.health.pkg.crossplane.io_FunctionRevision: *genericConditionHealth
  resource.customizations.health.apiextensions.crossplane.io_CompositeResourceDefinition: *genericConditionHealth
  resource.customizations.health.apiextensions.crossplane.io_Composition: *genericConditionHealth
  resource.customizations.health.apiextensions.crossplane.io_CompositionRevision: *genericConditionHealth
  resource.customizations.health.mssql.sql.m.crossplane.io_ClusterProviderConfig: *genericConditionHealth
  resource.customizations.health.mssql.sql.m.crossplane.io_Database: *genericConditionHealth
  resource.customizations.health.mssql.sql.m.crossplane.io_User: *genericConditionHealth
  resource.customizations.health.mssql.sql.m.crossplane.io_Grant: *genericConditionHealth
  resource.customizations.health.protection.crossplane.io_Usage: *genericConditionHealth
  resource.customizations.health.external-secrets.io_ClusterSecretStore: *genericConditionHealth
  resource.customizations.health.external-secrets.io_SecretStore: *genericConditionHealth
  resource.customizations.health.external-secrets.io_PushSecret: *genericConditionHealth
  resource.customizations.health.external-secrets.io_ExternalSecret: *genericConditionHealth
  resource.customizations.health.idp.demo.io_CompositeAppDatabase: &compositeHealth |
    hs = {}
    hs.status = "Progressing"
    hs.message = "Waiting for Crossplane reconciliation"

    if obj.status == nil or obj.status.conditions == nil then
      return hs
    end

    local synced = false
    local ready_false_message = nil
    local responsive_false_reason = nil
    local responsive_true = false

    for _, condition in ipairs(obj.status.conditions) do
      if condition.type == "Synced" and condition.status == "True" then
        synced = true
      end

      if condition.type == "Ready" and condition.status == "True" then
        hs.status = "Healthy"
        hs.message = condition.message or "Composite resource is ready"
      end

      if condition.type == "Ready" and condition.status == "False" then
        ready_false_message = condition.message
      end

      if condition.type == "Responsive" and condition.status == "False" then
        responsive_false_reason = condition.reason
      end

      if condition.type == "Responsive" and condition.status == "True" then
        responsive_true = true
      end

      if condition.type == "Synced" and condition.status == "False" then
        hs.status = "Degraded"
        hs.message = condition.message or "Composite resource is not synced"
        return hs
      end
    end

    if synced and responsive_false_reason == "WatchCircuitOpen" then
      hs.status = "Healthy"
      hs.message = ready_false_message or "Composite resource converged; watch circuit opened due to event volume"
      return hs
    end

    if synced and responsive_true and ready_false_message ~= nil then
      hs.status = "Healthy"
      hs.message = ready_false_message
      return hs
    end

    if ready_false_message ~= nil then
      hs.status = "Progressing"
      hs.message = ready_false_message
    end

    return hs

  resource.customizations.health.idp.demo.io_CompositeExternalDatabaseAccess: *compositeHealth
  resource.customizations.health.idp.demo.io_CompositeAppSecretImport: *compositeHealth
