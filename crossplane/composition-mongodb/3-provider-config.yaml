apiVersion: tf.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: terraform-mongodb-local
spec:
  configuration: |
    terraform {
      backend "kubernetes" {
        secret_suffix     = "terraform-mongodb-local"
        namespace         = "crossplane-system"
        in_cluster_config = true
      }
    }

    variable "mongodb_uri" {
      type = string
    }

    variable "mongodb_host" {
      type = string
    }

    variable "mongodb_port" {
      type = string
    }

    variable "mongodb_username" {
      type = string
    }

    variable "mongodb_password" {
      type      = string
      sensitive = true
    }

    variable "mongodb_auth_database" {
      type = string
    }

    provider "mongodb" {
      host          = var.mongodb_host
      port          = var.mongodb_port
      username      = var.mongodb_username
      password      = var.mongodb_password
      auth_database = var.mongodb_auth_database
    }
  credentials:
    - source: Secret
      filename: providerconfig.tfvars.json
      secretRef:
        name: mongodb-root-connection
        namespace: crossplane-system
        key: providerconfig.tfvars.json
