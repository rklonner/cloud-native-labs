apiVersion: tf.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: terraform-mongodb-local
  namespace: default
spec:
  configuration: |
    terraform {
      backend "kubernetes" {
        secret_suffix     = "terraform-mongodb-local"
        namespace         = "crossplane-system"
        in_cluster_config = true
      }
    }

    locals {
      mongodb = jsondecode(file("${path.module}/providerconfig.tfvars.json"))
    }

    provider "mongodb" {
      host          = local.mongodb.mongodb_host
      port          = local.mongodb.mongodb_port
      username      = local.mongodb.mongodb_username
      password      = local.mongodb.mongodb_password
      auth_database = local.mongodb.mongodb_auth_database
    }
  credentials:
    - source: Secret
      filename: providerconfig.tfvars.json
      secretRef:
        name: mongodb-root-connection
        namespace: crossplane-system
        key: providerconfig.tfvars.json
  credentials:
    - source: Secret
      filename: providerconfig.tfvars.json
      secretRef:
        name: mongodb-root-connection
        namespace: crossplane-system
        key: providerconfig.tfvars.json
