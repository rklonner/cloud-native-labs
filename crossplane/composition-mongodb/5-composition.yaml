apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xmongodatabases.mongodb.example.crossplane.io
spec:
  compositeTypeRef:
    apiVersion: mongodb.example.crossplane.io/v1alpha1
    kind: XMongoDatabase
  mode: Pipeline
  pipeline:
    - step: render-mongodb-workspace
      functionRef:
        name: crossplane-contrib-function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        spec:
          source: |
            oxr = option("params").oxr
            database_name = oxr.spec.parameters.databaseName
            rw_username = oxr.spec.parameters.rwUsername or (database_name + "-rw")
            ro_username = oxr.spec.parameters.roUsername or (database_name + "-ro")
            create_ro = oxr.spec.parameters.createReadOnlyUser if oxr.spec.parameters.createReadOnlyUser != None else True
            xr_name = oxr.metadata.name

            items = [{
              apiVersion = "tf.m.upbound.io/v1beta1"
              kind = "Workspace"
              metadata = {
                name = xr_name + "-tf"
                namespace = oxr.metadata.namespace
              }
              spec = {
                providerConfigRef = {
                  name = "terraform-mongodb-local"
                  kind = "ClusterProviderConfig"
                }
                writeConnectionSecretToRef = {
                  name = xr_name + "-connection"
                }
                forProvider = {
                  source = "Remote"
                  module = "git::https://github.com/rklonner/cloud-native-labs.git//crossplane/composition-mongodb/terraform?ref=main"
                  vars = [
                    { key = "database_name", value = database_name },
                    { key = "rw_username", value = rw_username },
                    { key = "ro_username", value = ro_username },
                    { key = "create_ro_user", value = "true" if create_ro else "false" },
                  ]
                }
              }
            }]
