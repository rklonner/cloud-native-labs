apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: build-run-signed-
spec:
  entrypoint: call-template
  serviceAccountName: default

  volumeClaimTemplates:
  - metadata:
      name: workdir
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi

  arguments:
    parameters:
    - name: repo-url
      value: "https://github.com/rklonner/cloud-native-labs.git"
    - name: dockerfile
      value: "argo-workflows/clone-build-push-sign-harbor/Dockerfile"
    - name: image-name
      value: "harbor.harbor.svc.cluster.local/library/my-app-signed:latest"
    - name: sign-image
      value: "true"

  templates:
  - name: call-template
    steps:
    - - name: run-build
        templateRef:
          name: clone-build-push-sign-image
          template: main
