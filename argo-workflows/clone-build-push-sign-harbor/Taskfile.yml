version: '3'

vars:
  VCLUSTER_NAME: my-cluster
  VCLUSTER_NAMESPACE: vcluster-{{.VCLUSTER_NAME}}
  VCLUSTER_CONTEXT: vcluster-docker_{{.VCLUSTER_NAME}}
  VCLUSTER_VALUES_FILE: vcluster.yaml
  VCLUSTER_TIMEOUT: 30s

  ARGOCD_NAMESPACE: argocd
  ARGOCD_CONTROLLER_NAME: argocd-application-controller

  HARBOR_NAMESPACE: harbor
  HARBOR_CA_SECRET: lab-clone-build-push-sign-harbor-harbor-nginx
  WORKFLOW_NAMESPACE: default
  COSIGN_PASSWORD: demo12345

  WORKFLOW_APP: argo-workflows
  HARBOR_APP: harbor
  HARBOR_CONFIG_APP: harbor-config
  KYVERNO_APP: kyverno
  RESOURCES_APP: resources
  ROOT_APP: root
  LAB_WORKFLOW_MANIFEST: workflow-clone-build-signed.yaml
  SIGNED_WORKFLOW_MANIFEST: workflow-clone-build-signed.yaml
  UNSIGNED_WORKFLOW_MANIFEST: workflow-clone-build-unsigned.yaml
  SIGNED_POD_MANIFEST: pod-my-app-signed.yaml
  UNSIGNED_POD_MANIFEST: pod-my-app-unsigned.yaml
  ROOT_APP_CREATE_TIMEOUT: 180s
  ROOT_APP_HEALTH_ATTEMPTS: 120
  ROOT_APP_HEALTH_SLEEP: 5

tasks:
  cluster:delete:
    desc: Delete the local vcluster
    cmds:
      - vcluster use driver docker
      - vcluster delete {{.VCLUSTER_NAME}} --namespace {{.VCLUSTER_NAMESPACE}} --ignore-not-found

  cluster:create:
    desc: Create the local vcluster and switch kubectl to it
    cmds:
      - vcluster use driver docker
      - |
        if docker ps --format '{{"{{.Names}}"}}' | grep -qx 'vcluster.cp.{{.VCLUSTER_NAME}}'; then
          timeout {{.VCLUSTER_TIMEOUT}} vcluster connect {{.VCLUSTER_NAME}} --namespace {{.VCLUSTER_NAMESPACE}}
        else
          timeout {{.VCLUSTER_TIMEOUT}} vcluster create {{.VCLUSTER_NAME}} --namespace {{.VCLUSTER_NAMESPACE}} -f {{.VCLUSTER_VALUES_FILE}}
        fi
      - kubectl config use-context {{.VCLUSTER_CONTEXT}}

  cluster:recreate:
    desc: Recreate the local vcluster from scratch
    cmds:
      - task: cluster:delete
      - task: cluster:create

  argocd:install:
    desc: Install Argo CD
    cmds:
      - task: cluster:create
      - kubectl create namespace {{.ARGOCD_NAMESPACE}} || true
      - kubectl apply --server-side --force-conflicts -n {{.ARGOCD_NAMESPACE}} -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      - kubectl apply -f apps/resources/secret-argocd-admin-password.yaml

  argocd:wait:
    desc: Wait for Argo CD and expose it on localhost:8000
    cmds:
      - task: argocd:install
      - kubectl -n {{.ARGOCD_NAMESPACE}} rollout status deployment/argocd-server --timeout=300s
      - kubectl -n {{.ARGOCD_NAMESPACE}} rollout status deployment/argocd-repo-server --timeout=300s
      - kubectl -n {{.ARGOCD_NAMESPACE}} rollout status statefulset/{{.ARGOCD_CONTROLLER_NAME}} --timeout=300s
      - kubectl apply -f apps/resources/service-argocd-local.yaml
      - for i in 1 2 3 4 5 6; do curl -skI --max-time 10 https://localhost:8000/ && exit 0; sleep 5; done; exit 1

  app:argo-workflows:
    desc: Apply the Argo Workflows child application
    cmds:
      - task: argocd:wait
      - kubectl apply -f apps/applications/argo-workflows.yaml

  argo-workflows:wait:
    desc: Wait for Argo Workflows server deployment
    cmds:
      - task: app:argo-workflows
      - kubectl wait --for=create deployment/lab-clone-build-push-sign-harbor-argo-workflows-server -n argo --timeout=180s
      - kubectl -n argo rollout status deployment/lab-clone-build-push-sign-harbor-argo-workflows-server --timeout=300s

  argo-workflows:ui:
    desc: Expose and verify Argo Workflows on localhost:2746
    cmds:
      - task: argo-workflows:wait
      - kubectl apply -f apps/resources/service-argo-workflows-local.yaml
      - for i in 1 2 3 4 5 6; do curl --fail --max-time 10 http://localhost:2746/ >/dev/null && exit 0; sleep 5; done; exit 1

  platform:apps:
    desc: Apply Argo Workflows, Harbor, and Kyverno apps after Argo CD is ready
    cmds:
      - task: argocd:wait
      - task: app:harbor
      - task app:argo-workflows & task app:harbor-config & task app:kyverno & wait

  platform:ready:
    desc: Wait for Argo Workflows, Harbor, and Kyverno to be ready
    cmds:
      - task: platform:apps
      - task argo-workflows:wait & task harbor:wait & task harbor-config:wait & task kyverno:wait & wait

  platform:ui:
    desc: Verify local Argo Workflows and Harbor access after platform readiness
    cmds:
      - task: platform:ready
      - task argo-workflows:ui & task harbor:ui & wait

  app:harbor:
    desc: Apply the Harbor child application
    cmds:
      - task: argocd:wait
      - kubectl apply -f apps/applications/harbor.yaml

  app:harbor-config:
    desc: Apply the Harbor config child application
    cmds:
      - task: app:harbor
      - kubectl apply -f apps/applications/harbor-config.yaml

  harbor:wait:
    desc: Wait for Harbor nginx and main service creation
    cmds:
      - task: app:harbor
      - kubectl wait --for=create deployment/lab-clone-build-push-sign-harbor-harbor-nginx -n harbor --timeout=180s
      - kubectl -n harbor rollout status deployment/lab-clone-build-push-sign-harbor-harbor-nginx --timeout=300s
      - kubectl wait --for=create service/harbor -n harbor --timeout=180s

  harbor:ui:
    desc: Expose and verify Harbor on localhost:8443
    cmds:
      - task: harbor:wait
      - kubectl apply -f apps/resources/service-harbor-local.yaml
      - for i in 1 2 3 4 5 6; do curl -skI --max-time 10 https://localhost:8443/ && exit 0; sleep 5; done; exit 1

  harbor-config:wait:
    desc: Wait for Harbor project configuration to complete
    cmds:
      - task: app:harbor-config
      - kubectl wait --for=create application/{{.HARBOR_CONFIG_APP}} -n {{.ARGOCD_NAMESPACE}} --timeout={{.ROOT_APP_CREATE_TIMEOUT}}
      - |
        for i in $(seq 1 {{.ROOT_APP_HEALTH_ATTEMPTS}}); do
          sync=$(kubectl -n {{.ARGOCD_NAMESPACE}} get application {{.HARBOR_CONFIG_APP}} -o jsonpath='{.status.sync.status}')
          health=$(kubectl -n {{.ARGOCD_NAMESPACE}} get application {{.HARBOR_CONFIG_APP}} -o jsonpath='{.status.health.status}')
          if [ "$sync" = "Synced" ] && [ "$health" = "Healthy" ]; then
            break
          fi
          sleep {{.ROOT_APP_HEALTH_SLEEP}}
          if [ "$i" -eq {{.ROOT_APP_HEALTH_ATTEMPTS}} ]; then
            printf 'application %s did not become Synced/Healthy (sync=%s health=%s)\n' '{{.HARBOR_CONFIG_APP}}' "$sync" "$health" >&2
            exit 1
          fi
        done

  app:root:
    desc: Apply the root application
    cmds:
      - task: argocd:wait
      - kubectl apply -f apps/root.yaml

  root:apply:
    desc: Recreate the root application
    cmds:
      - task: argocd:wait
      - kubectl delete application {{.ROOT_APP}} -n {{.ARGOCD_NAMESPACE}} --ignore-not-found=true
      - kubectl apply -f apps/root.yaml

  root:wait:
    desc: Wait for root-managed Argo CD applications
    cmds:
      - task: app:root
      - kubectl wait --for=create application/{{.WORKFLOW_APP}} -n {{.ARGOCD_NAMESPACE}} --timeout={{.ROOT_APP_CREATE_TIMEOUT}}
      - kubectl wait --for=create application/{{.HARBOR_APP}} -n {{.ARGOCD_NAMESPACE}} --timeout={{.ROOT_APP_CREATE_TIMEOUT}}
      - kubectl wait --for=create application/{{.HARBOR_CONFIG_APP}} -n {{.ARGOCD_NAMESPACE}} --timeout={{.ROOT_APP_CREATE_TIMEOUT}}
      - kubectl wait --for=create application/{{.KYVERNO_APP}} -n {{.ARGOCD_NAMESPACE}} --timeout={{.ROOT_APP_CREATE_TIMEOUT}}
      - kubectl wait --for=create application/{{.RESOURCES_APP}} -n {{.ARGOCD_NAMESPACE}} --timeout={{.ROOT_APP_CREATE_TIMEOUT}}
      - |
        for app in {{.WORKFLOW_APP}} {{.HARBOR_APP}} {{.HARBOR_CONFIG_APP}} {{.KYVERNO_APP}} {{.RESOURCES_APP}}; do
          for i in $(seq 1 {{.ROOT_APP_HEALTH_ATTEMPTS}}); do
            sync=$(kubectl -n {{.ARGOCD_NAMESPACE}} get application "$app" -o jsonpath='{.status.sync.status}')
            health=$(kubectl -n {{.ARGOCD_NAMESPACE}} get application "$app" -o jsonpath='{.status.health.status}')
            if [ "$sync" = "Synced" ] && [ "$health" = "Healthy" ]; then
              break
            fi
            sleep {{.ROOT_APP_HEALTH_SLEEP}}
            if [ "$i" -eq {{.ROOT_APP_HEALTH_ATTEMPTS}} ]; then
              printf 'application %s did not become Synced/Healthy (sync=%s health=%s)\n' "$app" "$sync" "$health" >&2
              exit 1
            fi
          done
        done

  app:kyverno:
    desc: Apply the Kyverno child application
    cmds:
      - task: argocd:wait
      - kubectl apply -f apps/applications/kyverno.yaml

  kyverno:install:
    desc: Recreate the Kyverno child application
    cmds:
      - task: argocd:wait
      - kubectl delete application {{.KYVERNO_APP}} -n {{.ARGOCD_NAMESPACE}} --ignore-not-found=true
      - kubectl apply -f apps/applications/kyverno.yaml

  kyverno:wait:
    desc: Wait for Kyverno deployment
    cmds:
      - task: app:kyverno
      - kubectl wait --for=create deployment/{{.KYVERNO_APP}}-admission-controller -n kyverno --timeout=180s
      - kubectl -n kyverno rollout status deployment/{{.KYVERNO_APP}}-admission-controller --timeout=300s

  kyverno:restart:
    desc: Restart the Kyverno admission controller to reload trust material
    cmds:
      - task: kyverno:wait
      - kubectl -n kyverno rollout restart deployment/{{.KYVERNO_APP}}-admission-controller
      - kubectl -n kyverno rollout status deployment/{{.KYVERNO_APP}}-admission-controller --timeout=300s

  argo-workflows:wait:root:
    desc: Wait for the root-managed Argo Workflows deployment
    cmds:
      - task: root:wait
      - kubectl wait --for=create deployment/lab-clone-build-push-sign-harbor-argo-workflows-server -n argo --timeout=180s
      - kubectl -n argo rollout status deployment/lab-clone-build-push-sign-harbor-argo-workflows-server --timeout=300s

  argo-workflows:ui:root:
    desc: Verify root-managed Argo Workflows on localhost:2746
    cmds:
      - task: argo-workflows:wait:root
      - task: resources:wait:root
      - for i in 1 2 3 4 5 6; do curl --fail --max-time 10 http://localhost:2746/ >/dev/null && exit 0; sleep 5; done; exit 1

  harbor:wait:root:
    desc: Wait for the root-managed Harbor deployment
    cmds:
      - task: root:wait
      - kubectl wait --for=create deployment/lab-clone-build-push-sign-harbor-harbor-nginx -n harbor --timeout=180s
      - kubectl -n harbor rollout status deployment/lab-clone-build-push-sign-harbor-harbor-nginx --timeout=300s
      - kubectl wait --for=create service/harbor -n harbor --timeout=180s

  harbor:ui:root:
    desc: Verify root-managed Harbor on localhost:8443
    cmds:
      - task: harbor:wait:root
      - task: resources:wait:root
      - for i in 1 2 3 4 5 6; do curl -skI --max-time 10 https://localhost:8443/ >/dev/null && exit 0; sleep 5; done; exit 1

  kyverno:wait:root:
    desc: Wait for the root-managed Kyverno deployment
    cmds:
      - task: root:wait
      - kubectl wait --for=create deployment/{{.KYVERNO_APP}}-admission-controller -n kyverno --timeout=180s
      - kubectl -n kyverno rollout status deployment/{{.KYVERNO_APP}}-admission-controller --timeout=300s

  kyverno:restart:root:
    desc: Restart the root-managed Kyverno admission controller to reload trust material
    cmds:
      - task: kyverno:wait:root
      - kubectl -n kyverno rollout restart deployment/{{.KYVERNO_APP}}-admission-controller
      - kubectl -n kyverno rollout status deployment/{{.KYVERNO_APP}}-admission-controller --timeout=300s

  resources:wait:root:
    desc: Wait for the root-managed resources application
    cmds:
      - task: root:wait

  harbor:trust-ca:root:only:
    desc: Trust the Harbor CA after root-managed bootstrap
    cmds:
      - ./scripts/trust-harbor-ca.sh {{.HARBOR_NAMESPACE}} {{.HARBOR_CA_SECRET}}
      - task: kyverno:restart:root

  harbor:trust-ca:root:
    desc: Trust the Harbor CA after root-managed bootstrap
    cmds:
      - task: resources:wait:root
      - task: harbor:trust-ca:root:only

  cosign:keys:root:only:
    desc: Generate cosign key pair after root-managed bootstrap
    cmds:
      - |
        if kubectl -n {{.WORKFLOW_NAMESPACE}} get secret cosign-keys >/dev/null 2>&1; then
          printf 'secret/cosign-keys already exists in namespace {{.WORKFLOW_NAMESPACE}}\n'
        else
          COSIGN_PASSWORD={{.COSIGN_PASSWORD}} cosign generate-key-pair k8s://{{.WORKFLOW_NAMESPACE}}/cosign-keys
        fi
      - task: cosign:pubkey:sync:root

  cosign:keys:root:
    desc: Generate cosign key pair after root-managed bootstrap
    cmds:
      - task: resources:wait:root
      - task: cosign:keys:root:only

  cosign:pubkey:sync:root:
    desc: Copy the cosign public key into the Kyverno namespace
    cmds:
      - task: resources:wait:root
      - kubectl delete secret cosign-public-key -n kyverno --ignore-not-found=true
      - |
        kubectl get secret cosign-keys -n {{.WORKFLOW_NAMESPACE}} -o jsonpath='{.data.cosign\.pub}' \
          | base64 -d \
          | kubectl create secret generic cosign-public-key \
              -n kyverno \
              --from-file=cosign.pub=/dev/stdin

  workflow:run:root:
    desc: Submit the workflow after root-managed platform bootstrap
    cmds:
      - task: cosign:keys:root
      - kubectl create -f {{.LAB_WORKFLOW_MANIFEST}}

  platform:ready:root:
    desc: Wait for the root-managed Argo Workflows, Harbor, and Kyverno components
    cmds:
      - task: root:wait
      - task argo-workflows:wait:root & task harbor:wait:root & task kyverno:wait:root & wait

  platform:ui:root:
    desc: Verify local Argo Workflows and Harbor access after root-managed platform readiness
    cmds:
      - task: platform:ready:root
      - task argo-workflows:ui:root & task harbor:ui:root & wait

  resources:apply:only:
    desc: Apply lab-local resources
    cmds:
      - kubectl apply -f apps/resources

  resources:apply:
    desc: Apply lab-local resources after the platform is ready
    cmds:
      - task: platform:ready
      - task: resources:apply:only

  harbor:trust-ca:only:
    desc: Copy Harbor CA into all vcluster node containers and refresh trust
    cmds:
      - ./scripts/trust-harbor-ca.sh {{.HARBOR_NAMESPACE}} {{.HARBOR_CA_SECRET}}
      - task: kyverno:restart

  harbor:trust-ca:
    desc: Copy Harbor CA into all vcluster node containers and refresh trust
    cmds:
      - task: resources:apply
      - task: harbor:trust-ca:only

  cosign:keys:only:
    desc: Generate cosign key pair in the vcluster if the secret is missing
    cmds:
      - |
        if kubectl -n {{.WORKFLOW_NAMESPACE}} get secret cosign-keys >/dev/null 2>&1; then
          printf 'secret/cosign-keys already exists in namespace {{.WORKFLOW_NAMESPACE}}\n'
        else
          COSIGN_PASSWORD={{.COSIGN_PASSWORD}} cosign generate-key-pair k8s://{{.WORKFLOW_NAMESPACE}}/cosign-keys
        fi
      - task: cosign:pubkey:sync

  cosign:keys:
    desc: Generate cosign key pair in the vcluster if the secret is missing
    cmds:
      - task: resources:apply
      - task: cosign:keys:only

  cosign:pubkey:sync:
    desc: Copy the cosign public key into the Kyverno namespace
    cmds:
      - task: resources:apply
      - kubectl delete secret cosign-public-key -n kyverno --ignore-not-found=true
      - |
        kubectl get secret cosign-keys -n {{.WORKFLOW_NAMESPACE}} -o jsonpath='{.data.cosign\.pub}' \
          | base64 -d \
          | kubectl create secret generic cosign-public-key \
              -n kyverno \
              --from-file=cosign.pub=/dev/stdin

  workflow:run:
    desc: Submit the signed clone build push sign workflow
    cmds:
      - task: cosign:keys
      - kubectl create -f {{.LAB_WORKFLOW_MANIFEST}}

  workflow:run:signed:
    desc: Submit the signed image workflow
    cmds:
      - task: cosign:keys
      - kubectl create -f {{.SIGNED_WORKFLOW_MANIFEST}}

  workflow:run:unsigned:
    desc: Submit the unsigned image workflow
    cmds:
      - task: cosign:keys
      - kubectl create -f {{.UNSIGNED_WORKFLOW_MANIFEST}}

  workflow:logs:
    desc: Follow the latest workflow logs
    cmds:
      - argo logs @latest --follow

  lab:up:
    desc: Bootstrap the lab platform and prepare cosign verification
    cmds:
      - task: argocd:wait
      - task: platform:ready
      - task: resources:apply:only
      - task: harbor:trust-ca:only
      - task: cosign:keys:only

  lab:up:root:
    desc: Bootstrap the lab platform through the Argo CD root application and prepare cosign verification
    cmds:
      - task: argocd:wait
      - task: app:root
      - task: platform:ready:root
      - task: resources:wait:root
      - task: harbor:trust-ca:root:only
      - task: cosign:keys:root:only

  lab:run:
    desc: Bootstrap the lab, prepare cosign verification, and submit the example workflow
    cmds:
      - task: lab:up
      - kubectl create -f {{.LAB_WORKFLOW_MANIFEST}}

  lab:run:root:
    desc: Bootstrap the lab platform through the root application, prepare cosign verification, and submit the workflow
    cmds:
      - task: lab:up:root
      - kubectl create -f {{.LAB_WORKFLOW_MANIFEST}}

  pod:deploy:
    desc: Deploy the signed sample pod that pulls the Harbor-hosted image
    cmds:
      - task: harbor:trust-ca
      - kubectl apply -f {{.SIGNED_POD_MANIFEST}}

  pod:deploy:signed:
    desc: Deploy the signed sample pod
    cmds:
      - task: harbor:trust-ca
      - kubectl apply -f {{.SIGNED_POD_MANIFEST}}

  pod:deploy:unsigned:
    desc: Deploy the unsigned sample pod
    cmds:
      - task: harbor:trust-ca
      - kubectl apply -f {{.UNSIGNED_POD_MANIFEST}}
