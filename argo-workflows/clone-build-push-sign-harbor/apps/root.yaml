apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-clone-build-push-sign-harbor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rklonner/cloud-native-labs.git
    targetRevision: HEAD
    path: argo-workflows/clone-build-push-sign-harbor/apps/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
