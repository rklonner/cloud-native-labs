apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-workflows
    targetRevision: 0.45.24
    helm:
      releaseName: lab-clone-build-push-sign-harbor-argo-workflows
      values: |
        workflow:
          serviceAccount:
            create: false
            name: default
          rbac:
            create: true
            rules:
              - apiGroups:
                  - argoproj.io
                resources:
                  - workflowtaskresults
                verbs:
                  - create
                  - patch
                  - update
                  - get
                  - list
                  - watch
        controller:
          workflowNamespaces:
            - default
        server:
          enabled: true
          authModes:
            - server
        crds:
          install: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
