apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-clone-build-push-sign-harbor-harbor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://helm.goharbor.io
      chart: harbor
      helm:
        valueFiles:
          - $values/harbor/cluster-internal-registry/values.yaml
    - repoURL: https://github.com/rklonner/cloud-native-labs.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
