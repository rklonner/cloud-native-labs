apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: buildah-git-template
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  arguments:
    parameters:
      - name: repo-url
      - name: dockerfile
      - name: image-name
      - name: sign-image
        value: "true"

  volumeClaimTemplates:
    - metadata:
        name: workdir
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

  templates:
    - name: main
      steps:
        - - name: clone
            template: clone-repo
        - - name: build
            template: build-image

    - name: clone-repo
      script:
        image: alpine/git
        workingDir: /workspace
        command: [sh]
        source: |
          set -e
          git clone --depth 1 "{{workflow.parameters.repo-url}}" .
        volumeMounts:
          - name: workdir
            mountPath: /workspace

    - name: build-image
      script:
        image: quay.io/buildah/stable:latest
        workingDir: /workspace
        command: [sh]
        env:
          - name: COSIGN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: cosign-keys
                key: cosign.password
          - name: REGISTRY_USER
            valueFrom:
              secretKeyRef:
                name: cosign-harbor-login
                key: username
          - name: REGISTRY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: cosign-harbor-login
                key: password
        source: |
          set -e
          COSIGN_VERSION="3.0.5"
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
              COSIGN_ARCH="amd64"
          elif [ "$ARCH" = "aarch64" ]; then
              COSIGN_ARCH="arm64"
          else
              COSIGN_ARCH="amd64"
          fi

          curl -L "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-${COSIGN_ARCH}" -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign

          mkdir -p /etc/containers
          printf '%s\n%s\n' \
            'unqualified-search-registries = ["docker.io", "quay.io"]' \
            'short-name-mode = ""' > /etc/containers/registries.conf

          buildah bud --storage-driver=vfs \
            -t "{{workflow.parameters.image-name}}" \
            -f "{{workflow.parameters.dockerfile}}" .

          buildah push --storage-driver=vfs \
            --authfile /etc/buildah-auth/.dockerconfigjson \
            --tls-verify=false \
            --digestfile=/workspace/digest.txt \
            "{{workflow.parameters.image-name}}"

          DIGEST=$(cat /workspace/digest.txt)
          IMAGE_BASE=$(printf '%s' "{{workflow.parameters.image-name}}" | cut -d: -f1)
          IMAGE_WITH_DIGEST="${IMAGE_BASE}@${DIGEST}"

          if [ "{{workflow.parameters.sign-image}}" = "true" ]; then
            cosign sign --key /etc/cosign/cosign.key \
              --allow-insecure-registry=true \
              --registry-username="$REGISTRY_USER" \
              --registry-password="$REGISTRY_PASSWORD" \
              --new-bundle-format=false \
              --use-signing-config=false \
              --tlog-upload=false \
              "$IMAGE_WITH_DIGEST"
          else
            printf 'Skipping cosign signing for %s\n' "$IMAGE_WITH_DIGEST"
          fi
        securityContext:
          privileged: true
        volumeMounts:
          - name: workdir
            mountPath: /workspace
          - name: registry-auth
            mountPath: /etc/buildah-auth
            readOnly: true
          - name: cosign-key
            mountPath: /etc/cosign
            readOnly: true
      volumes:
        - name: registry-auth
          secret:
            secretName: harbor-creds
        - name: cosign-key
          secret:
            secretName: cosign-keys
