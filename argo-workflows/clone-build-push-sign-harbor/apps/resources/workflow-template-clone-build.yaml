apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: buildah-git-template
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  arguments:
    parameters:
      - name: repo-url
      - name: dockerfile
      - name: image-name
      - name: sign-image
        value: "true"

  volumeClaimTemplates:
    - metadata:
        name: workdir
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

  templates:
    - name: main
      steps:
        - - name: clone
            template: clone-repo
        - - name: build
            template: build-image
        - - name: sign
            template: sign-image
            when: '{{workflow.parameters.sign-image}} == true'
            arguments:
              parameters:
                - name: image-with-digest
                  value: '{{steps.build.outputs.parameters.image-with-digest}}'

    - name: clone-repo
      script:
        image: alpine/git
        workingDir: /workspace
        command: [sh]
        source: |
          set -e
          git clone --depth 1 "{{workflow.parameters.repo-url}}" .
        volumeMounts:
          - name: workdir
            mountPath: /workspace

    - name: build-image
      outputs:
        parameters:
          - name: image-with-digest
            valueFrom:
              path: /workspace/image-with-digest.txt
      script:
        image: quay.io/buildah/stable:latest
        workingDir: /workspace
        command: [sh]
        securityContext:
          privileged: true
        env:
          - name: REGISTRY_USER
            valueFrom:
              secretKeyRef:
                name: cosign-harbor-login
                key: username
          - name: REGISTRY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: cosign-harbor-login
                key: password
        source: |
          set -e
          mkdir -p /etc/containers
          printf '%s\n%s\n' \
            'unqualified-search-registries = ["docker.io", "quay.io"]' \
            'short-name-mode = ""' > /etc/containers/registries.conf

          buildah bud --storage-driver=vfs \
            -t "{{workflow.parameters.image-name}}" \
            -f "{{workflow.parameters.dockerfile}}" .

          buildah push --storage-driver=vfs \
            --authfile /etc/buildah-auth/.dockerconfigjson \
            --tls-verify=false \
            --digestfile=/workspace/digest.txt \
            "{{workflow.parameters.image-name}}"

          DIGEST=$(cat /workspace/digest.txt)
          IMAGE_BASE=$(printf '%s' "{{workflow.parameters.image-name}}" | cut -d: -f1)
          IMAGE_WITH_DIGEST="${IMAGE_BASE}@${DIGEST}"
          printf '%s' "$IMAGE_WITH_DIGEST" > /workspace/image-with-digest.txt
        volumeMounts:
          - name: workdir
            mountPath: /workspace
          - name: registry-auth
            mountPath: /etc/buildah-auth
            readOnly: true
      volumes:
        - name: registry-auth
          secret:
            secretName: harbor-creds

    - name: sign-image
      inputs:
        parameters:
          - name: image-with-digest
      container:
        image: ghcr.io/sigstore/cosign/cosign:v2.4.1
        command: [cosign]
        args:
          - sign
          - --key
          - /etc/cosign/cosign.key
          - --yes
          - --allow-insecure-registry=true
          - --registry-username=$(REGISTRY_USER)
          - --registry-password=$(REGISTRY_PASSWORD)
          - --tlog-upload=false
          - '{{inputs.parameters.image-with-digest}}'
        env:
          - name: COSIGN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: cosign-keys
                key: cosign.password
          - name: REGISTRY_USER
            valueFrom:
              secretKeyRef:
                name: cosign-harbor-login
                key: username
          - name: REGISTRY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: cosign-harbor-login
                key: password
        volumeMounts:
          - name: cosign-key
            mountPath: /etc/cosign
            readOnly: true
      volumes:
        - name: cosign-key
          secret:
            secretName: cosign-keys
